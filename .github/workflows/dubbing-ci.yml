name: Dubbing CI

# Verifies the AI dubbing feature on a real runner (internet access, Android SDK, ffmpeg):
#  - core: JVM tests with real ffmpeg, plus live tests against Microsoft Edge TTS and OpenRouter *free* models
#  - android: compiles and assembles the app (debug) so the Android-side code is checked for real
#
# Optional repository secret: OPENROUTER_API_KEY (live translation test is skipped without it).

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Instrumented test class filter (empty = all dubbing tests)"
        required: false
        default: ""
  push:
    paths:
      - "dubbing-core/**"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/dubbing-ci.yml"
      - ".github/scripts/**"

concurrency:
  group: dubbing-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests (+ live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Network probe (OpenRouter + Edge hosts)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          echo "--- openrouter /models (public)"
          curl -sS -m 30 -o /tmp/models.json -w "HTTP %{http_code}\n" https://openrouter.ai/api/v1/models
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/models.json'))['data']
              free = [m['id'] for m in d if m['id'].endswith(':free')
                      and float(m['pricing']['prompt']) == 0 and float(m['pricing']['completion']) == 0]
              print(len(d), "models,", len(free), "free")
              print("\n".join(free[:25]))
          except Exception as e:
              print("could not parse:", e)
          PY
          echo "--- key present: $([ -n "$OPENROUTER_API_KEY" ] && echo yes || echo no)"
          echo "--- edge host reachable?"
          curl -sS -m 15 -o /dev/null -w "HTTP %{http_code}\n" https://speech.platform.bing.com/ || true

      - name: Subtitle source probe (which sites give English subtitles to a CI runner)
        continue-on-error: true
        run: |
          pip install -q yt-dlp 2>&1 | tail -1
          yt-dlp --version
          for u in "https://www.youtube.com/watch?v=jNQXAC9IVRw" "https://www.ted.com/talks/sir_ken_robinson_do_schools_kill_creativity" "https://vimeo.com/76979871" "https://archive.org/details/BigBuckBunny_124"; do
            echo "=== $u"; rm -rf /tmp/s; mkdir /tmp/s
            timeout 150 yt-dlp --no-playlist --skip-download --write-subs --write-auto-subs --sub-langs "en.*,en" --convert-subs srt -o "/tmp/s/sub.%(ext)s" "$u" 2>&1 | tail -3
            ls -la /tmp/s | tail -4
          done

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDGE_TTS_LIVE: "1"
        run: |
          chmod +x gradlew
          ./gradlew -p dubbing-core test --console=plain

      - name: Print live test output
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for fn in sorted(glob.glob('dubbing-core/build/test-results/test/*.xml')):
              r = ET.parse(fn).getroot()
              name = r.get('name').split('.')[-1]
              print(f"{name}: tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')} skipped={r.get('skipped')}")
              if name == 'LiveTest':
                  out = r.find('system-out')
                  print((out.text or '').strip() if out is not None else '(no output)')
                  for tc in r.findall('testcase'):
                      st = 'SKIPPED' if tc.find('skipped') is not None else ('FAILED' if (tc.find('failure') is not None or tc.find('error') is not None) else 'passed')
                      print(' -', tc.get('name'), st)
                      for tag in ('failure', 'error'):
                          el = tc.find(tag)
                          if el is not None:
                              print((el.get('message') or '')[:1500])
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubbing-core-test-report
          path: dubbing-core/build/reports/tests/test

  android:
    name: Android build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Assemble github debug
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --console=plain --stacktrace

  e2e:
    name: Android emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle creates a throw-away debug keystore on a fresh runner, so every build used to carry a different signature
      # and could not be installed over the previous one. Keep one key in the Actions cache (never in the repo).
      - name: Restore signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: ~/ci-keystore
          key: dubbing-ci-keystore-v2

      # If the repository has the secrets ANDROID_KEYSTORE_B64 (+ ANDROID_KEYSTORE_PASSWORD), that key is used and is
      # permanent. Without them a throw-away key kept in the Actions cache is used (lost after 7 idle days).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/ci-keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/ci-keystore/secret.jks"
            echo "KS_FILE=$HOME/ci-keystore/secret.jks" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=${KS_PASS:-ytdlnis-ci}" >> "$GITHUB_ENV"
            echo "using the signing key from the repository secret"
          else
            if [ ! -f "$HOME/ci-keystore/ci.jks" ]; then
              keytool -genkeypair -keystore "$HOME/ci-keystore/ci.jks" -storetype PKCS12 \
                -storepass ytdlnis-ci -keypass ytdlnis-ci -alias ytdlnis -keyalg RSA -keysize 2048 \
                -validity 36500 -dname "CN=YTDLnis Pro, O=lifeee.top, C=CN"
              echo "created a new throw-away signing key"
            else
              echo "reusing the cached signing key"
            fi
            echo "KS_FILE=$HOME/ci-keystore/ci.jks" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=ytdlnis-ci" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK (installable artifact)
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --console=plain -Pci.keystore="$KS_FILE" -Pci.keystore.password="$KS_PASSWORD"

      - name: Save signing key
        if: always() && steps.signing-key.outputs.cache-hit != 'true' && !contains(env.KS_FILE, 'secret.jks')
        uses: actions/cache/save@v4
        with:
          path: ~/ci-keystore
          key: dubbing-ci-keystore-v2

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-dubbing-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEST_FILTER: ${{ github.event.inputs.tests }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/run-e2e.sh

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          t = f = s = 0
          for fn in sorted(glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)):
              r = ET.parse(fn).getroot()
              for tc in r.iter('testcase'):
                  t += 1
                  bad = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                  if bad is not None:
                      f += 1
                      print('FAILED', tc.get('classname').split('.')[-1], tc.get('name'))
                      print((bad.get('message') or bad.text or '')[:2500])
                  elif tc.find('skipped') is not None:
                      s += 1
                      print('SKIPPED', tc.get('name'))
                  else:
                      print('passed', tc.get('classname').split('.')[-1], tc.get('name'))
          print(f'TOTAL {t} failed {f} skipped {s}')
          PY

      - name: Upload evidence (reports, logcat, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            e2e-logs

  release:
    name: Publish APK to Releases
    # Only after every check passed. A release asset is a plain download link (works in a phone browser).
    needs: [core, e2e]
    # The build itself must be green (core tests); a flaky emulator UI run must not hold the APK back,
    # its result is written into the release notes instead.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ytdlnis-dubbing-debug-apk
          path: apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la apks
          ARM64=$(ls apks/*arm64-v8a*.apk | head -1)
          echo "publishing $ARM64"
          gh release delete dubbing-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create dubbing-latest "$ARM64" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "YTDLnis + AI 中文配音（测试版）" \
            --notes "由 CI 自动构建。适用于绝大多数手机（arm64）。包名为 top.lifeee.ytdlnis，可与官方版共存。核心测试：${{ needs.core.result }}；模拟器端到端测试：${{ needs.e2e.result }}。提交：$GITHUB_SHA"
